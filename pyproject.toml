[tool.poetry]
package-mode = false

[project]
name = "python-coursework"
version = "0.1.0"
description = ""
authors = [
    {name = "bairchyk",email = "brakshaev7@bk.ru"}
]
requires-python = "^3.13"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-calamine (>=0.9.0,<0.10.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pandas-stubs (>=3.1.0.261029,<4.0.0.0)"
]

[tool.black]
line-length = 119
exclude = '\.venv'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = '\.venv'